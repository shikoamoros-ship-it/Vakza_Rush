name: Convert HTML to APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myApp com.vakzarush.app VakzaRush
          cd myApp
          cordova platform add android
          
      - name: Copy HTML Files to App
        run: |
          rm -rf myApp/www/*
          # Копируем всё содержимое вашего репозитория (кроме папки самого cordova-проекта и скрытых файлов) в папку сборки
          rsync -av --exclude='myApp' --exclude='.git' --exclude='.github' ./ myApp/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd myApp
          cordova build android --device

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VakzaRush-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
